appId: com.hxallai.bot
productName: HXBot
copyright: HXBot 研究版 · 仅限研究使用，不得用于商业用途 · 版权与许可见安装包内 LICENSE、NOTICE
protocols:
  - name: HXBot invitations
    schemes:
      - hxbot
asar: true
artifactName: HXBot-${version}-${arch}.${ext}
electronUpdaterCompatibility: ">=2.16"
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish:
  provider: generic
  url: https://bot.hxallai.com/updates/desktop
# HXBot: what is new in this version, for the update window (hx/release-notes.json).
releaseInfo:
  releaseNotes: "{\"version\": \"0.67.14\", \"zh\": [\"助手能直接改 Excel、Word、PowerPoint 和 PDF 文件，改之前先留一份。对话里的卡片列出改了哪些格子、段落或页，点“恢复到修改前”就回去；留版本的空间在“设置 → Computer Use”里改，满了先问你。\", \"老格式也能改，你开着的文档不受影响：.xls、.doc、.ppt 先由电脑上的 LibreOffice、Numbers、Pages、Keynote 或 Office 在副本上转换，.csv 由 HXBot 自己读；HXBot 只退出它自己打开的应用。\", \"排队看得见：对话和任务显示“排队（第几位，约几分钟）”和原因；团队的进度卡每个成员一行，写着在做什么、在等什么，可以点“更急 / 普通 / 不急”调先后。\", \"模型服务商忙时自动缓一缓：被限速时同时发出的请求减半、暂停一会儿，你自己发的消息照样先试；某个模型前面排队太久时，开着“自动选择模型”的助手把新工作改用同档或更好的模型，对话里写一行；团队因为像在原地打转而暂停时，附上一个小模型的看法，只供参考。\"], \"en\": [\"Agents edit Excel, Word, PowerPoint and PDF files directly, and keep a copy first. The card in the chat lists the cells, paragraphs or slides that changed; click “Restore to before the change” to go back. Set the space for these copies in Settings › Computer Use; when it is full, HXBot asks you.\", \"Old formats work too, and the documents you have open stay as they are: .xls, .doc and .ppt are converted on a copy by LibreOffice, Numbers, Pages, Keynote or Office on this computer, and HXBot reads .csv itself. HXBot quits only the apps it opened.\", \"See the queue: chats and tasks show their place, about how long, and why they wait. A team's progress card has a line for each member, what it does or waits for, and a switch: urgent, normal, not urgent.\", \"When a model's provider is busy, HXBot eases off: after a throttle, it sends half as many requests at once and pauses a moment, and your own message still goes first. When a model has too long a queue, an agent with automatic model choice moves new work to a model of the same rank or better, with one line in the chat. When a team pauses because it may be going in circles, a small model's view comes with it, for reference only.\"]}"
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**/*"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**/*"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**/*"
  # The TypeScript source of Effect. Its package exports point only to `dist`.
  - "!node_modules/effect/src/**/*"
  # Nothing reads the source maps of the dependencies, and they were 150 MB of the 414 MB app.asar.
  # A hosted server fetches the whole app.asar from its lazy disk before HXBot can start.
  - "!node_modules/**/*.map"
  # HXBot (v1.7.4): pdf.js reads the text of PDFs in the main process. Only its legacy build, the character maps
  # and the standard fonts are used; it draws nothing, so its viewer, image decoders and native canvas stay out.
  - "!node_modules/pdfjs-dist/build/**/*"
  - "!node_modules/pdfjs-dist/web/**/*"
  - "!node_modules/pdfjs-dist/image_decoders/**/*"
  - "!node_modules/pdfjs-dist/types/**/*"
  - "!node_modules/pdfjs-dist/legacy/web/**/*"
  - "!node_modules/pdfjs-dist/legacy/image_decoders/**/*"
  - "!node_modules/pdfjs-dist/legacy/build/*.min.mjs"
  - "!node_modules/pdfjs-dist/legacy/build/pdf.sandbox*"
  - "!node_modules/@napi-rs/canvas*/**/*"
asarUnpack:
  # The database host is loaded by path as a separate process, not required into the main bundle.
  - out/main/agent-database-host.js
  # The voice transcription and speech hosts are started by path in the same way.
  - out/main/voice-transcription-host.js
  - out/main/voice-speech-host.js
  # The unpacked host resolves Effect without loading any application module from asar.
  - node_modules/effect/**/*
  # The FFI addon that stops the Dynamic Island panel from activating the app on macOS.
  - node_modules/@koromix/koffi-*/**/*
extraResources:
  - from: resources/managed-skills
    to: managed-skills
  - from: resources/plugin-catalog
    to: plugin-catalog
  - from: resources/agent-import
    to: agent-import
  # `hxbot-cli.mjs` runs tasks on agents through the Local scripts API; see docs/automation.md.
  - from: resources/cli
    to: cli
  # `cpu-limit.cjs` makes os.cpus() follow the CPU limit for the Node programs of agents on a server.
  - from: resources/agent-runtime
    to: agent-runtime
  - from: build/icon-production.png
    to: icons/icon-production.png
  - from: build/icon-dev.png
    to: icons/icon-dev.png
  - from: build/icon-preview.png
    to: icons/icon-preview.png
  # The Dock and window icons for the logo color setting. macOS has no alternate app icon API, so
  # the app sets one of these while it runs.
  - from: build/logo-colors
    to: icons/logo-colors
  - from: node_modules/electron/dist/LICENSE
    to: licenses/Electron-LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  - from: build/licenses/sherpa-onnx-LICENSE
    to: licenses/sherpa-onnx-LICENSE
  - from: build/licenses/onnxruntime-LICENSE
    to: licenses/onnxruntime-LICENSE
  - from: build/licenses/NVIDIA-Parakeet-TDT-0.6B-v3-LICENSE
    to: licenses/NVIDIA-Parakeet-TDT-0.6B-v3-LICENSE
  - from: build/licenses/NVIDIA-Parakeet-Unified-EN-0.6B-LICENSE
    to: licenses/NVIDIA-Parakeet-Unified-EN-0.6B-LICENSE
  - from: build/licenses/Underdog-Bark-3.0-Plus-LICENSE
    to: licenses/Underdog-Bark-3.0-Plus-LICENSE
  - from: build/licenses/OpenAI-Whisper-LICENSE
    to: licenses/OpenAI-Whisper-LICENSE
  - from: build/licenses/Cohere-Transcribe-LICENSE
    to: licenses/Cohere-Transcribe-LICENSE
  - from: build/licenses/Supertone-Supertonic-3-LICENSE
    to: licenses/Supertone-Supertonic-3-LICENSE
# The voice runtime, the remote desktop runtime and each Computer Use driver are built for one
# target, so their resources are listed under each platform instead of here.
# electron-builder merges the root and platform lists, so every build still gets its own, while a
# build has no missing `from` to fail on and no other platform's driver to carry.
directories:
  output: dist
toolsets:
  # The static AppImage runtime (AppImage/type2-runtime) has libfuse built in, so the AppImage starts
  # on Arch Linux, Omarchy and other systems with no libfuse.so.2. It needs only `fusermount3`
  # from fuse3. The default toolset needs libfuse.so.2. `--appimage-extract` works with both.
  appimage: "1.0.3"
mac:
  category: public.app-category.productivity
  minimumSystemVersion: "13.0"
  notarize: false
  hardenedRuntime: true
  # macOS 26 shows the catalog that `CFBundleIconName` names, with our own dark version; without it,
  # macOS 26 makes the dark icon a black tile with black eyes. The catalog also has flat images, and
  # `icon.icns` stays for macOS versions that read only `CFBundleIconFile`. Make the catalog again
  # with `bun scripts/compile-macos-icon.ts` after a change to the `.icon` file.
  icon: build/icon-production.icns
  extraResources:
    - from: build/icon-production-macos-safe-area.png
      to: icons/icon-production-macos-safe-area.png
    - from: build/icon-dev-macos-safe-area.png
      to: icons/icon-dev-macos-safe-area.png
    - from: build/icon-preview-macos-safe-area.png
      to: icons/icon-preview-macos-safe-area.png
    # The menu bar icon. macOS draws a `Template` image in the color of the menu bar.
    - from: build/macos/tray
      to: icons/tray
      filter:
        - "*.png"
    # The sherpa-onnx addon and its libraries. The dictation and speech models are downloaded on demand.
    - from: .hxbot-build/voice/runtime
      to: voice/runtime
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/darwin/${arch}
      to: cua-driver/darwin/${arch}
  # The Computer Use driver arrives signed by Cua AI with the hardened runtime, a secure timestamp
  # and `com.apple.security.automation.apple-events`. Re-signing it with HXBot's inherited
  # entitlements would drop that entitlement and break the driver's Automation route, so its own
  # Developer ID signature is kept. Notarization accepts a nested binary signed by another team.
  signIgnore:
    - Contents/Resources/cua-driver/
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  extendInfo:
    # HXBot (v1.7.3 hotfix): no process of the bundle gets a Dock tile at launch, so a local server child never shows
    # one. The desktop app makes itself a regular app before it finishes launching (src/main/hx-dock.ts).
    LSUIElement: true
    NSMicrophoneUsageDescription: HXBot uses the microphone to transcribe voice prompts locally on this Mac.
    # Computer Use runs the driver as a child process, so macOS asks for both grants in HXBot's
    # name and shows these sentences. Under the hardened runtime, macOS shows the Automation prompt
    # only when the app has `com.apple.security.automation.apple-events` in its entitlements.
    NSScreenCaptureUsageDescription: HXBot captures the screen so an agent can see the app windows you ask it to control.
    NSAppleEventsUsageDescription: HXBot sends Automation events so an agent can control the apps you ask it to control.
    NSUserActivityTypes:
      - NSUserActivityTypeBrowsingWeb
  # No `arch` here: a target's own `arch` list replaces the one given on the command line, so
  # `--x64` would still build ARM64. With no flag, electron-builder builds for the machine it runs
  # on. Build one architecture at a time: the voice runtime and remote desktop builds on disk are for the
  # architecture of the machine that made them.
  target:
    - dmg
    - zip
win:
  icon: build/icon-production.ico
  extraResources:
    - from: .hxbot-build/voice/runtime
      to: voice/runtime
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/win32/x64
      to: cua-driver/win32/x64
  target:
    - target: nsis
      arch:
        - x64
# The assisted installer lets the user choose the disk and folder. `build/installer.nsh` keeps it
# per-user and moves the install into an `HXBot` subfolder when the chosen folder holds other
# files, because the uninstaller deletes the whole folder. An update reads the folder from
# `InstallLocation`. The app starts it silently (`src/main/update-service.ts`), so an update shows
# no page.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  icon: build/icon-production.png
  synopsis: HXBot research edition, a multi-agent workspace. For research use only.
  extraResources:
    - from: build/linux/hxbot.apparmor
      to: linux/hxbot.apparmor
    # A hosted server installs the packages, scripts and units of the release that it updates to.
    - from: scripts/hosting
      to: hosting
      filter:
        - "**/*"
        - "!*.ts"
    # The sherpa-onnx addon and its libraries. The dictation and speech models are downloaded on demand.
    - from: .hxbot-build/voice/runtime
      to: voice/runtime
    # Only the x64 build installs this runtime. For arm64 the directory does not exist, and
    # electron-builder skips a missing source with a warning.
    - from: build/remote-desktop-runtime
      to: remote-desktop-runtime
    - from: build/cua-driver/linux/${arch}
      to: cua-driver/linux/${arch}
  # Electron takes its Linux app id from `desktopName` in package.json, and the window manager
  # matches a running window to the launcher through `StartupWMClass`. Syncing the two from one
  # value is what makes the taskbar icon group with the window it belongs to.
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
dmg:
  title: ${productName} ${version}
  # The art is 478 pt high, so it fills the window when Finder shows only the title bar.
  # With the tab bar and status bar, the window shows the top 410 pt.
  background: build/dmg-background.png
  iconSize: 128
  iconTextSize: 14
  window:
    x: 400
    y: 467
    width: 680
    height: 506
  contents:
    - x: 190
      y: 220
    - x: 490
      y: 220
      type: link
      path: /Applications
