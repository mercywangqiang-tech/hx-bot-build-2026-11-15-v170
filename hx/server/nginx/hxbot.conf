# HXBot 研究版 · nginx 站点配置
# 由 scripts/setup-https.sh 放到 nginx 站点配置目录（/etc/nginx/conf.d 或宝塔的 vhost 目录），不改动 www.hxallai.com 原有配置。
# 不在 443 上开启 http2：http2 开关作用于整个 443 端口，开启会连带改变官网的协议。
#
#   bot.hxallai.com          门户首页（登录 + 下载中心）、网页版 /app
#   api.bot.hxallai.com      账号服务 API（桌面端、手机端调用）
#   signal.bot.hxallai.com   信令 WebSocket（wss://）
#   turn.bot.hxallai.com     只用于申请证书；TURN 本身走 3478/5349 端口，不经过 nginx
#
# 证书：scripts/setup-https.sh 用 Let's Encrypt 申请一张包含以上四个域名的证书，名为 hxbot。

map $http_upgrade $hxbot_connection_upgrade {
  default upgrade;
  "" close;
}

# 访问日志：《网络安全法》要求网络日志至少保存 6 个月。只记地址路径，不记 ? 后的查询参数（邀请链接里的凭证不进日志）；
# iOS 无线安装地址里的随机串同样不进日志，记成 /ota/-/…。
# scripts/setup-https.sh 创建 /var/log/hxbot 并安装 logrotate 配置：每天轮转一次，保留 200 天后自动删除。
map $request_uri $hxbot_log_path {
  "~^/ota/[^/?]*(?<hxbot_ota_rest>[^?]*)" "/ota/-$hxbot_ota_rest";
  "~^(?<hxbot_path>[^?]*)" $hxbot_path;
  default "";
}
log_format hxbot_log '$remote_addr [$time_local] $host "$request_method $hxbot_log_path $server_protocol" $status $body_bytes_sent "$http_user_agent" $request_time';

# ---------- 80 端口：申请证书 + 跳转 HTTPS ----------
server {
  listen 80;
  server_name bot.hxallai.com api.bot.hxallai.com signal.bot.hxallai.com turn.bot.hxallai.com;
  access_log /var/log/hxbot/access.log hxbot_log;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/hxbot-acme;
    default_type text/plain;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------- bot.hxallai.com：门户、下载中心、网页版 ----------
server {
  listen 443 ssl;
  server_name bot.hxallai.com;
  access_log /var/log/hxbot/access.log hxbot_log;

  ssl_certificate /etc/letsencrypt/live/hxbot/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hxbot/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:hxbot_ssl:10m;

  client_max_body_size 12m;
  add_header X-Content-Type-Options nosniff always;

  # 本地运行时的调试接口，绝不能对外
  location ^~ /cdn-cgi/ {
    return 404;
  }

  # 门户首页（静态页，登录和下载都在这里）
  location = / {
    root /opt/hxbot/portal;
    try_files /index.html =404;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
  }
  # 门户英文版（同一个页面，按地址显示英文）
  location = /en/ {
    root /opt/hxbot/portal;
    try_files /index.html =404;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
  }
  location = /en {
    return 301 /en/;
  }
  location ^~ /hx-portal/ {
    alias /opt/hxbot/portal/assets/;
    expires 1h;
  }

  # 使用指南、新功能与亮点、服务条款、隐私政策（静态页，由 hx/scripts/site-pages.mjs 生成，放在 /opt/hxbot/portal/pages）
  location ~ ^/(guide|whats-new|terms|privacy)/$ {
    root /opt/hxbot/portal;
    try_files /pages/$1.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
  location ~ ^/en/(guide|whats-new|terms|privacy)/$ {
    root /opt/hxbot/portal;
    try_files /pages/$1.en.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
  location ~ ^/(en/)?(guide|whats-new|terms|privacy)$ {
    return 301 /$1$2/$is_args$args;
  }

  # 下载中心：必须登录（由账号服务校验登录 Cookie）
  location ^~ /downloads/ {
    auth_request /_hxbot_session;
    error_page 401 = @hxbot_login;
    alias /opt/hxbot/downloads/;
    autoindex off;
    add_header Cache-Control "private, no-store";
    add_header X-Robots-Tag "noindex, nofollow";
  }
  # iOS 无线安装（Ad Hoc 安装包）。来取清单和安装包的是手机系统的安装程序，它不带网页的登录状态，所以这里不校验登录：
  # 地址里的 32 位随机串由 scripts/publish-downloads.py 生成，只写在登录后才能读到的 manifest.json 里，换安装包时更换；
  # 安装包本身只能装到签名时登记过的设备上。其余 /ota/ 地址一律 404；存放这些文件的 .ota 目录不能从 /downloads/ 访问。
  location ^~ /downloads/.ota/ {
    return 404;
  }
  location ~ "^/ota/([0-9a-f]{32})/manifest\.plist$" {
    alias /opt/hxbot/downloads/.ota/$1/manifest.plist;
    types { }
    default_type text/xml;
    add_header Cache-Control "private, no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Content-Type-Options nosniff always;
  }
  # 安卓安装包：手机里点“更新”后由系统浏览器下载（不带登录状态），随机串同样只写在登录后才能读到的清单里
  location ~ "^/ota/([0-9a-f]{32})/HXBot\.apk$" {
    alias /opt/hxbot/downloads/.ota/$1/HXBot.apk;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "private, no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Disposition "attachment; filename=HXBot.apk";
  }
  location ~ "^/ota/([0-9a-f]{32})/HXBot\.ipa$" {
    alias /opt/hxbot/downloads/.ota/$1/HXBot.ipa;
    types { }
    default_type application/octet-stream;
    add_header Cache-Control "private, no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Content-Type-Options nosniff always;
  }
  location /ota/ {
    return 404;
  }
  # 客户端在应用里更新（v1.6.2 起）：桌面端的更新文件（desktop/）和手机端的新版本信息（mobile.json）。
  # 请求带 HXBot 的登录令牌（Authorization: Bearer），由账号服务校验，没登录取不到；浏览器里登录后也能打开。
  # 文件由 scripts/publish-downloads.py 整理，增量更新要用到范围请求（Range），nginx 的静态文件本来就支持。
  location ^~ /updates/ {
    auth_request /_hxbot_bearer;
    error_page 401 = @hxbot_unauthorized;
    alias /opt/hxbot/downloads/updates/;
    autoindex off;
    add_header Cache-Control "private, no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Content-Type-Options nosniff always;
  }
  location = /_hxbot_bearer {
    internal;
    proxy_pass http://127.0.0.1:8787/api/browser/hx/signed-in;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-HX-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }
  location @hxbot_unauthorized {
    default_type application/json;
    return 401 '{"error":{"code":"unauthorized","message":"Sign in to HXBot first."}}';
  }
  location = /_hxbot_session {
    internal;
    proxy_pass http://127.0.0.1:8787/api/browser/session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-HX-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
  }
  location @hxbot_login {
    return 302 /?login=1;
  }

  # 账号服务只转发研究版用到的地址：接口、网页版 /app、邀请页 /join、集成回调、静态资源与网站图标。
  # 账号服务里还带着上游项目原有的官网页面（各语言首页、定价、团队、市场、模板与插件介绍、新闻、文档、对比、条款、
  # 找不到页面等），研究版一律不对外：凡是不在下面名单里的地址都回到门户，页面上不会出现上游项目的名称。
  location ~ ^/(api|v1|v2|oauth|health|scim|\.well-known|_serverFn|app|join|slack|discord|billing|assets)(/|$) {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-HX-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect http://$host/ /;
    proxy_read_timeout 120s;
  }
  location ^~ /plugins/icon/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-HX-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect http://$host/ /;
    proxy_read_timeout 120s;
  }
  location ~ ^/(favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png|icon-192x192\.png|icon-512x512\.png|site\.webmanifest|robots\.txt)$ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-HX-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect http://$host/ /;
    proxy_read_timeout 120s;
  }
  location / {
    return 302 /;
  }
}

# ---------- api.bot.hxallai.com：账号服务 API ----------
server {
  listen 443 ssl;
  server_name api.bot.hxallai.com;
  access_log /var/log/hxbot/access.log hxbot_log;

  ssl_certificate /etc/letsencrypt/live/hxbot/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hxbot/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 32m;

  location ^~ /cdn-cgi/ {
    return 404;
  }
  # 这个地址只给客户端调用接口；网页一律回到门户 bot.hxallai.com（原因同上）
  location ~ ^/(api|v1|v2|oauth|health|scim|\.well-known|_serverFn|slack|discord|billing|assets)(/|$) {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-HX-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect http://$host/ /;
    proxy_read_timeout 120s;
  }
  location ^~ /plugins/icon/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-HX-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect http://$host/ /;
    proxy_read_timeout 120s;
  }
  location ~ ^/(favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png|icon-192x192\.png|icon-512x512\.png|site\.webmanifest|robots\.txt)$ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-HX-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect http://$host/ /;
    proxy_read_timeout 120s;
  }
  location ~ ^/(app|join|guide|whats-new|terms|privacy|en/guide|en/whats-new|en/terms|en/privacy)(/|$) {
    return 302 https://bot.hxallai.com$request_uri;
  }
  location / {
    return 302 https://bot.hxallai.com/;
  }
}

# ---------- signal.bot.hxallai.com：信令 WebSocket ----------
server {
  listen 443 ssl;
  server_name signal.bot.hxallai.com;
  access_log /var/log/hxbot/access.log hxbot_log;

  ssl_certificate /etc/letsencrypt/live/hxbot/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hxbot/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 11m;

  location = /metrics {
    return 404;
  }
  # 账号服务通过 Docker 内网直接调用，不对外开放
  location ^~ /internal/ {
    return 404;
  }
  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $hxbot_connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }
}
