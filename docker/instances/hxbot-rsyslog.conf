# The container logs of the HXBot instances. `hxbot-instance setup` installs it as
# /etc/rsyslog.d/30-hxbot-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. hxbot-logrotate keeps the files for 30 days.
template(name="HxbotDockerFile" type="string" string="/var/log/hxbot/%programname%.log")
template(name="HxbotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="hxbot-docker") {
  # The tag is the container name, which hxbot-instance gives.
  if $programname startswith "hxbot-" then {
    # setup makes /var/log/hxbot for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="HxbotDockerFile" template="HxbotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/hxbot-docker/dev/log" ruleset="hxbot-docker" createPath="off")
