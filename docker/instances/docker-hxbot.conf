# Docker starts the HXBot containers when it starts. `hxbot-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/hxbot.conf.
[Unit]
# No container starts without its firewall: when hxbot-firewall fails, Docker does not start.
Requires=hxbot-firewall.service
After=hxbot-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
# A container with the LXCFS files of lxcfs.yaml does not start before LXCFS mounts them.
Wants=lxcfs.service
After=lxcfs.service
